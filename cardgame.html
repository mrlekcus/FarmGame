<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>咖啡牌局</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0e12;color:#ffe9a8;font-family:"Noto Sans TC","PingFang TC",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:#c99a63;background-image:repeating-linear-gradient(0deg,#c99a63 0 28px,#b98a55 28px 56px),repeating-linear-gradient(90deg,transparent 0 78px,#9a6e3a 78px 80px)}
#wall{height:54px;flex:none;background:#7a4a2a;border-bottom:5px solid #5a3a22;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:700}
#wall .win{width:60px;height:26px;background:#fff0d4;border:3px solid #5a3a22}
#msg{flex:1;text-align:center;font-size:clamp(13px,3.6vw,18px);color:#fff}
#stage{position:relative;flex:1;min-height:0}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transition:filter .2s}
.seat{--aw:clamp(40px,11vw,64px)}
.pic{position:relative;width:var(--aw);height:calc(var(--aw)*1.5)}
.pic canvas,.pic img{image-rendering:pixelated}
.pic .chair{position:absolute;left:50%;top:27%;width:calc(var(--aw)*1.2);transform:translateX(-50%);z-index:0}
.pic .av{position:absolute;left:0;bottom:0;width:100%;height:auto;z-index:1}
.tbw{height:calc(var(--aw)*.5 + 6px);display:flex;flex-direction:column;align-items:center;gap:2px;visibility:hidden}.tbw.on{visibility:visible}
.bd{font-size:clamp(10px,2.8vw,12px);font-weight:800;padding:1px 8px;border:2px solid #0a0e1c;background:#555;color:#fff;white-space:nowrap}.bd.ok{background:#2a7a3a}
.seat.empty .nm{opacity:.7;border-style:dashed}
#ptxt{display:none;text-align:center;color:#fff;font-weight:800;font-size:clamp(15px,4.4vw,22px);line-height:1.6;text-shadow:0 2px 0 #0a3a1a}
#ptxt b{display:block;font-size:clamp(34px,11vw,60px);color:#ffd34d}
#rdy{display:none;flex:1;font-size:clamp(16px,4.6vw,22px);padding:.8em;background:#ffd34d}#rdy.on{background:#ff8a7a;color:#fff}
.seat .nm{background:#12182c;border:2px solid #ffe9a8;padding:1px 8px;font-size:clamp(10px,2.8vw,13px);white-space:nowrap;font-weight:700}
.seat .bk{display:flex}.seat .bk i{width:14px;height:20px;background:#e8453c;border:2px solid #1a1018;margin-left:-7px;display:block}.seat .bk i:first-child{margin-left:0}
.seat .cnt{font-size:clamp(11px,3vw,14px);color:#fff;font-weight:700}
.seat.turn{filter:drop-shadow(0 0 8px #ffd34d)}.seat.turn .nm{background:#7a1a1a;color:#ffd34d}
#s1{top:22px;left:50%;transform:translateX(-50%)}#s2{left:4px;top:50%;transform:translateY(-50%)}#s3{right:4px;top:50%;transform:translateY(-50%)}
#s0{left:50%;bottom:6px;transform:translateX(-50%)}
#table{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(66vw,440px);height:clamp(100px,calc(100% - 215px),270px);background:radial-gradient(ellipse at 50% 40%,#3f9a5e,#2f7a4a 70%);border:9px solid #7a4a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,24px);box-shadow:0 0 0 4px #3a2214,inset 0 0 0 3px #4aa86a,0 8px 0 4px rgba(0,0,0,.25)}
.card{position:relative;width:var(--cw,50px);height:calc(var(--cw,50px)*1.45);border:3px solid #1a1018;background:#fffaf0;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:calc(var(--cw,50px)*.5);flex:none}
.card .in{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center}
.card .ov{position:absolute;width:62%;height:56%;background:#fffaf0;border-radius:50%;transform:rotate(25deg)}
.card .ch{position:relative;z-index:1}.card .ct,.card .cb{position:absolute;font-size:calc(var(--cw,50px)*.22);z-index:1;line-height:1}.card .ct{left:3px;top:2px}.card .cb{right:3px;bottom:2px}
.c-r .in{background:#e8453c}.c-r .ch{color:#e8453c}.c-y .in{background:#f2c230}.c-y .ch{color:#d9a400}.c-g .in{background:#3fa65a}.c-g .ch{color:#3fa65a}.c-b .in{background:#3b7be0}.c-b .ch{color:#3b7be0}
.c-k .in{background:conic-gradient(#e8453c 0 25%,#f2c230 0 50%,#3fa65a 0 75%,#3b7be0 0)}.c-k .ch{color:#2a2a38}
.card.back .in{background:#2a2a38}.card.back .ov{background:#e8453c;transform:rotate(25deg)}.card.back .ch{color:#f2c230;font-size:calc(var(--cw,50px)*.3)}
#draw{cursor:pointer}#draw.hint{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:translateY(-4px);filter:drop-shadow(0 0 6px #fff)}}
#disc.pop{animation:pop .3s}@keyframes pop{0%{transform:scale(1.4) rotate(-10deg)}100%{transform:none}}
#colr{position:absolute;right:-14px;top:-14px;width:30px;height:30px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #1a1018}
#dir{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:clamp(10px,2.8vw,13px);color:#d8f5df;font-weight:700;white-space:nowrap}
#hand{flex:none;background:#12182c;border-top:3px solid #ffe9a8;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px}
#cards{flex:1;display:flex;overflow-x:auto;padding:8px 4px 4px;align-items:flex-end;min-height:calc(var(--cw)*1.45 + 24px);--cw:clamp(44px,12vw,62px);scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
#cards .card{cursor:pointer;margin-left:calc(var(--ov,-8px));transition:transform .12s}
#cards .card:first-child{margin-left:0}
#cards .card.ok{transform:translateY(-10px);box-shadow:0 0 0 3px #fff}
#cards .card.no{filter:brightness(.55)}
.btns{display:flex;flex-direction:column;gap:6px;flex:none}
button{font:inherit;font-weight:800;font-size:clamp(13px,3.6vw,17px);background:#9fb0d0;color:#12182c;border:3px solid #0a0e1c;padding:.5em .9em;cursor:pointer}
#uno{background:#ffd34d}#uno.arm{background:#ff5c5c;color:#fff}#uno.pls{animation:pulse .6s infinite}
#pass,#catch{display:none}#catch{background:#ff5c5c;color:#fff;animation:pulse .5s infinite}
.modal{position:absolute;inset:0;background:rgba(10,6,20,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;z-index:5}
.modal h2{margin:0;color:#ffd34d}.pick{display:grid;grid-template-columns:repeat(2,90px);gap:10px}.pick b{height:70px;border:4px solid #fff;cursor:pointer}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(22px,7vw,44px);font-weight:900;color:#fff;text-shadow:0 3px 0 #000;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:4}
#note{position:absolute;left:6px;bottom:2px;font-size:10px;color:#5a3a22}
@media (max-height:620px) and (orientation:landscape){#table .card{--cw:34px!important}}
@media (orientation:portrait){#table{width:min(60vw,300px);height:clamp(150px,calc(100% - 260px),300px)}#s2{top:46%}#s3{top:46%}}
@media (max-height:620px) and (orientation:landscape){#wall{height:38px}.seat{--aw:34px}.seat .bk{display:none}.seat .cnt{margin-top:-2px}#s1{top:18px}#s0{bottom:2px}#table{width:min(56vw,400px);height:clamp(70px,calc(100% - 150px),270px);top:50%}}

#wall.turn{background:#7a1a1a;color:#ffd34d}#wall.mine{background:#2a7a3a;color:#fff}#msg{transition:none}
.seat.turn img{outline:4px solid #ffd34d;outline-offset:2px;border-radius:50%;animation:pulse2 .9s infinite}@keyframes pulse2{50%{outline-color:#fff}}
.tb{width:70px;height:6px;background:#222;border:1px solid #000;overflow:hidden}.tb i{display:block;height:100%;width:100%;background:#ffd34d;transform-origin:left;animation:tb linear forwards}@keyframes tb{to{transform:scaleX(0)}}
.tt{font-size:11px;color:#fff;font-weight:700}
#mp .big{font-size:clamp(60px,20vw,110px);font-weight:900;color:#fff;line-height:1}#mp .sl{display:flex;gap:14px;font-size:13px;color:#fff;flex-wrap:wrap;justify-content:center}
#fx{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.fxfl{position:absolute;inset:0;animation:fxfl 1.1s ease-out forwards}@keyframes fxfl{0%{box-shadow:inset 0 0 0 0 rgba(255,211,77,0)}15%{box-shadow:inset 0 0 70px 26px rgba(255,211,77,.85)}100%{box-shadow:inset 0 0 0 0 rgba(255,211,77,0)}}
.fxray{position:absolute;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(rgba(255,211,77,.55) 0 6deg,rgba(255,92,92,0) 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0,#000 14%,transparent 40%);mask:radial-gradient(circle,#000 0,#000 14%,transparent 40%);animation:fxray 1.2s ease-out forwards}@keyframes fxray{0%{transform:scale(.2) rotate(0);opacity:1}100%{transform:scale(1) rotate(40deg);opacity:0}}
.fxtx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg);font-weight:900;white-space:nowrap;color:#ffd34d;font-size:clamp(56px,22vw,150px);text-shadow:0 0 0 #7a1a1a,-4px -4px 0 #7a1a1a,4px -4px 0 #7a1a1a,-4px 4px 0 #7a1a1a,4px 4px 0 #7a1a1a,0 8px 0 #7a1a1a;animation:fxtx 1.3s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes fxtx{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(.1);opacity:0}25%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.1);opacity:0}}
.fxcr{position:absolute;width:clamp(100px,26vw,150px);height:clamp(100px,26vw,150px);margin:calc(clamp(100px,26vw,150px)/-2) 0 0 calc(clamp(100px,26vw,150px)/-2);border:6px solid #ff2a2a;border-radius:50%;animation:fxcr 1.5s ease-out forwards}
.fxcr:before,.fxcr:after{content:"";position:absolute;background:#ff2a2a}.fxcr:before{left:50%;top:-22px;bottom:-22px;width:4px;margin-left:-2px}.fxcr:after{top:50%;left:-22px;right:-22px;height:4px;margin-top:-2px}
@keyframes fxcr{0%{transform:scale(3) rotate(90deg);opacity:0}25%{transform:scale(1) rotate(0);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.fxst{position:absolute;left:50%;top:42%;font-weight:900;white-space:nowrap;color:#ff5c5c;font-size:clamp(44px,15vw,100px);transform:translate(-50%,-50%) rotate(-8deg);text-shadow:-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff,4px 4px 0 #fff,0 7px 0 #7a1a1a;animation:fxst 1.5s cubic-bezier(.2,1.8,.4,1) forwards}
.fxst small{display:block;text-align:center;font-size:.36em;color:#fff;text-shadow:-2px -2px 0 #7a1a1a,2px -2px 0 #7a1a1a,-2px 2px 0 #7a1a1a,2px 2px 0 #7a1a1a}
@keyframes fxst{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(3);opacity:0}22%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.05);opacity:0}}
.shake{animation:shake .45s}@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#cbtn{flex:none;align-self:center;font-size:clamp(18px,5vw,24px);padding:.35em .5em;background:#9fb0d0}
#sbar{display:none;flex:1;align-items:center;justify-content:center;color:#ffe9a8;font-weight:800;font-size:clamp(14px,4vw,18px)}
#cp{display:none;position:absolute;left:8px;right:8px;bottom:calc(var(--hh,96px) + 6px);z-index:8;background:rgba(18,24,44,.97);border:2px solid #ffd34d;border-radius:12px;padding:10px}
#cp h4{margin:0 0 6px;color:#ffd34d;font-size:13px}
#cp .eg{display:flex;justify-content:space-around;margin-bottom:10px}#cp .eg button{font-size:clamp(24px,7vw,34px);padding:.1em .25em;background:#2a3050;border-color:#ffe9a8}
#cp .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#cp .pg button{font-size:clamp(11px,3.2vw,14px);padding:.45em .2em;background:#2a3050;color:#fff;border-color:#ffe9a8}
.spc{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px}
.spc img{width:clamp(30px,8vw,44px);image-rendering:pixelated}
.spc .nm2{background:#12182c;border:2px solid #ffe9a8;padding:0 6px;font-size:clamp(9px,2.4vw,11px);color:#fff;font-weight:700;white-space:nowrap}
.spc.me .nm2{color:#ffd34d}
#wc{position:absolute;left:50%;top:1px;transform:translateX(-50%);z-index:3;background:#12182c;border:2px solid #ffd34d;color:#ffd34d;font-size:clamp(10px,2.8vw,13px);font-weight:800;padding:1px 10px;white-space:nowrap;display:none}
.bub{position:absolute;z-index:9;transform:translate(-50%,-100%);background:#fff;border:3px solid #12182c;border-radius:12px;padding:3px 10px;font-weight:800;color:#12182c;font-size:clamp(12px,3.4vw,16px);white-space:nowrap;animation:bub 2.4s ease-out forwards}
.bub.em{font-size:clamp(22px,6.5vw,32px);border-radius:50%;padding:2px 6px}
.bub:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top-color:#12182c;border-bottom:0}
@keyframes bub{0%{transform:translate(-50%,-70%) scale(.3);opacity:0}12%{transform:translate(-50%,-100%) scale(1.1);opacity:1}20%{transform:translate(-50%,-100%) scale(1)}85%{transform:translate(-50%,-100%);opacity:1}100%{transform:translate(-50%,-130%);opacity:0}}
#snd{position:absolute;right:8px;top:8px;width:40px;padding:.2em 0;z-index:6;background:#ffd34d}
#x{position:absolute;left:8px;top:8px;padding:.2em .6em;background:#e8453c;color:#fff;z-index:6}#wall{padding-left:56px}</style></head><body>

 return '<div class="pic"><img class="chair" src="'+CHD[SIDE[id]]+'">'+av+'</div><div class="nm">'+nmt+'</div>'+mid}

 else $('mr').style.display='none';
